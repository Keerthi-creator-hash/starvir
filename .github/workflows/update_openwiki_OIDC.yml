name: Monthly OpenWiki Documentation Update

# Stavir test copy of the centrim_api OpenWiki pipeline.
# Same branch / save / PR approach, with the OpenWiki + AWS part
# excluded. The "generate" step just writes a file into openwiki/
# so every later step runs exactly as in the real workflow.
# Tick "simulate_failure" to test the failure path (draft PR).

on:
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Simulate the OpenWiki step failing (tests the draft PR path)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: openwiki-documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-openwiki:
    runs-on: ubuntu-latest

    env:
      # Target branch for the PR. Fixed to main so a re-run started from a
      # WIP docs branch still opens its PR against main.
      BASE_BRANCH: main

    steps:

      # ==================================================
      # 1. Checkout repository with full history
      # ==================================================
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ==================================================
      # 2. Create the working branch up front
      #    Everything (success or incremental) is pushed here,
      #    never directly to the protected base branch.
      # ==================================================
      - name: Create documentation branch
        shell: bash
        run: |
          BRANCH_NAME="docs/openwiki-$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"
          echo "Base branch   : $BASE_BRANCH"
          echo "Working branch: $BRANCH_NAME"

      # ==================================================
      # 3. Simulated OpenWiki step
      #    (stands in for steps 3-8 of the real workflow)
      # ==================================================
      - name: Update OpenWiki documentation (simulated)
        id: openwiki
        shell: bash
        env:
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
        run: |
          LOG_FILE="openwiki-run.log"
          echo "Simulated OpenWiki run started $(date -u)" | tee "$LOG_FILE"
          mkdir -p openwiki
          echo "# Test page" > "openwiki/test-page.md"
          echo "" >> "openwiki/test-page.md"
          echo "Generated by run ${GITHUB_RUN_ID} at $(date -u)" >> "openwiki/test-page.md"
          echo "Wrote openwiki/test-page.md" | tee -a "$LOG_FILE"
          if [ "$SIMULATE_FAILURE" = "true" ]; then
            echo '{"phase":"generating","note":"simulated interrupted run"}' > openwiki/.run.json
            echo "Simulating OpenWiki failure." | tee -a "$LOG_FILE"
            exit 1
          fi
          echo "Simulated OpenWiki run completed." | tee -a "$LOG_FILE"

      # ==================================================
      # 4. Show final OpenWiki changes
      # ==================================================
      - name: Show OpenWiki final status
        if: always()
        shell: bash
        run: |
          echo "Git status:"
          git status --short
          echo ""
          echo "OpenWiki files:"
          find openwiki -type f | sort || true

      # ==================================================
      # 5. Save the generated docs as an artifact
      # ==================================================
      - name: Upload OpenWiki output as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwiki-${{ github.run_id }}
          path: |
            openwiki/
            openwiki-run.log
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

      # ==================================================
      # 6. Commit and push to the working branch
      #    Runs on success AND failure.
      # ==================================================
      - name: Commit and push OpenWiki documentation
        if: always()
        id: commit
        shell: bash
        env:
          OPENWIKI_OUTCOME: ${{ steps.openwiki.outcome }}
        run: |
          git config user.name "centrim-openwiki[bot]"
          git config user.email "centrim-openwiki[bot]@users.noreply.github.com"
          git add openwiki/
          echo ""
          echo "Files ready to commit:"
          git diff --cached --name-only
          if git diff --cached --quiet; then
            echo ""
            echo "No documentation changes."
            echo "Nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$OPENWIKI_OUTCOME" = "success" ]; then
            COMMIT_MSG="docs: monthly AI spec and technical documentation update"
          else
            COMMIT_MSG="docs(wip): incremental OpenWiki update (run ${GITHUB_RUN_ID} failed)"
          fi
          echo ""
          echo "Committing: $COMMIT_MSG"
          git commit -m "$COMMIT_MSG"
          echo ""
          echo "Pushing to $BRANCH_NAME ..."
          git push origin "HEAD:${BRANCH_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Documentation pushed to branch $BRANCH_NAME."

      # ==================================================
      # 7. Open a pull request to the base branch
      #    Normal PR on success, draft PR on failure.
      # ==================================================
      - name: Create pull request
        if: always() && steps.commit.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OPENWIKI_OUTCOME: ${{ steps.openwiki.outcome }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TODAY="$(date -u +%Y-%m-%d)"
          if [ "$OPENWIKI_OUTCOME" = "success" ]; then
            TITLE="docs: monthly OpenWiki documentation update (${TODAY})"
            printf '%s\n' \
              "Automated OpenWiki documentation update (pipeline test)." \
              "" \
              "Run: ${RUN_URL}" \
              > pr-body.md
            DRAFT_FLAG=""
          else
            TITLE="WIP: incremental OpenWiki documentation update (${TODAY})"
            printf '%s\n' \
              "OpenWiki run FAILED. This PR holds the incremental pages completed before the failure." \
              "" \
              "Do not merge as-is. To resume, re-run this workflow from branch ${BRANCH_NAME}." \
              "" \
              "Run: ${RUN_URL}" \
              > pr-body.md
            DRAFT_FLAG="--draft"
          fi
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH_NAME" \
            --title "$TITLE" \
            --body-file pr-body.md \
            $DRAFT_FLAG
